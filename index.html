<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eiweiß-Küche</title>
<meta name="description" content="Tagebuch, Barcode-Scanner, Rezepte und Einkaufsliste für eiweißreiches Essen.">
<meta name="theme-color" content="#F2F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://world.openfoodfacts.org https://eiweiss-garmin.j-ranglack.workers.dev; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>
/* Schriften liegen in der App (SIL Open Font License), kein Abruf bei Google */
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/atkinson-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(./fonts/atkinson-400i.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/atkinson-700.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600 800;font-display:swap;src:url(./fonts/bricolage-var.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/jetbrains-500.woff2) format("woff2")}
/* Eine Spalte bis 640px, unten feste Reiterleiste, Eingaben in Bodensheets wie in einer nativen App. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --ink:#1B221D; --muted:#5A665D; --line:#D8E0D6;
  --accent:#2C6946; --accent-ink:#FFFFFF; --accent-soft:#DFEBE2;
  --warm:#8F530C; --warm-soft:#F5EADB; --hot:#B23A26; --hot-soft:#F8E3DE;
  --m-eiw:#2C6946; --m-kh:#B07A12; --m-fett:#7A5AA6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101412; --surface:#181E1A; --ink:#E3EAE4; --muted:#98A59C; --line:#28322B;
    --accent:#7CC598; --accent-ink:#0C1910; --accent-soft:#1C3026;
    --warm:#E5AA60; --warm-soft:#2D2317; --hot:#F08A72; --hot-soft:#3A201A;
    --m-eiw:#7CC598; --m-kh:#E3B34F; --m-fett:#B79BE0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.zahl{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.leise{color:var(--muted);font-size:14px;margin:0}
.fuss{color:var(--muted);font-size:13px;margin:8px 0 0}

.app-kopf{padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between}
.marke{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
main{max-width:640px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 88px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.seitentitel{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;margin:6px 0 0}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.unter{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
details.karte>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between}
details.karte>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.karte[open]>summary::after{content:"−"}
details.karte>summary::-webkit-details-marker{display:none}
.grund ul{margin:0;padding-left:20px;display:grid;gap:6px}

/* Knöpfe */
.knopf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.knopf.voll{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.knopf.warn{color:var(--hot);border-color:var(--hot)}
.knopf.breit{width:100%}
.knoepfe{display:flex;flex-wrap:wrap;gap:8px}
.text-knopf{border:0;background:none;color:var(--accent);padding:6px 0;cursor:pointer;justify-self:start;text-decoration:underline;text-underline-offset:3px}
.rund{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.rund.klein{width:32px;height:32px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:38px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:42px;height:42px;border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:999px}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:1.8em;text-align:center}
.stepper input{width:5.5em;border:0;background:transparent;text-align:center;font-size:20px;padding:6px 0}
.stepper.gross button{width:48px;height:48px}
.por-zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}

/* Tagebuch */
.datum-leiste{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datum{border:0;background:none;font-family:var(--f-display);font-weight:800;font-size:24px;cursor:pointer;padding:4px 8px}
.bilanz .b-oben{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bilanz .b-oben>div{display:grid}
.b-rechts{text-align:right}
.gross{font-size:34px;font-weight:500;line-height:1}
.balken{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.balken span{display:block;height:100%;background:var(--accent);border-radius:99px}
.balken.ueber span{background:var(--hot)}
.balken.m-kh span{background:var(--m-kh)}.balken.m-fett span{background:var(--m-fett)}.balken.m-eiw span{background:var(--m-eiw)}
.balken.m-kh,.balken.m-fett,.balken.m-eiw{height:7px}
.makros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.makro{display:grid;gap:5px;min-width:0}
.mk-kopf{display:grid;font-size:13px}
.mk-kopf .zahl{font-size:12px;color:var(--muted)}
.mahlzeit{display:grid;gap:6px}
.mz-kopf{display:flex;align-items:center;gap:10px}
.mz-kopf h3{flex:1}
.eintraege,.treffer{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.eintraege button,.treffer button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:52px}
.en{display:grid;min-width:0}
.en b{font-weight:700;overflow-wrap:anywhere}
.en small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.eintraege .zahl,.treffer .zahl{white-space:nowrap;font-size:13px}
table.naehr{width:100%;border-collapse:collapse;font-size:14px}
.naehr th{text-align:left;font-weight:400;padding:6px 0;border-bottom:1px solid var(--line)}
.naehr td{text-align:right;padding:6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.naehr tr.einr th{padding-left:14px;color:var(--muted)}
.naehr small{color:var(--muted)}

/* Rezepte */
.r-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.r-karte{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.r-nr{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px}
.r-text{display:grid;gap:4px;min-width:0}
.r-text b{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.r-text small{color:var(--warm);font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.meta li{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}
.meta li.n{background:var(--accent-soft);border-color:transparent}
.meta li.scharf{background:var(--hot-soft);border-color:transparent;color:var(--hot)}
.meta li.mild{background:var(--accent-soft);border-color:transparent}
.mit{margin:0;font-style:italic;color:var(--warm)}
.mildbox{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.tipp{margin:0;padding:12px 14px;border-left:3px solid var(--warm);background:var(--warm-soft);border-radius:0 10px 10px 0}
.quelle{margin:0;font-size:13px;color:var(--muted)}
.zutaten{display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.zutaten section{padding:14px 16px;display:grid;gap:8px;min-width:0}
.zutaten section.sosse{background:var(--warm-soft)}
.zutaten h4{margin:0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.zutaten section.sosse h4{color:var(--warm)}
.zl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.zl li{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:8px;font-size:15px;line-height:1.35;align-items:start}
.zl.edit li{grid-template-columns:5em minmax(0,1fr) auto;align-items:center}
.zl .m{font-family:var(--f-mono);font-size:13px;padding-top:1px}
.zl .h{display:block;font-size:13px;color:var(--muted)}
.schritte{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.schritte li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.schritte li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px}
.t{font-family:var(--f-mono);font-size:.86em;background:var(--accent-soft);padding:1px 6px;border-radius:5px;white-space:nowrap}

/* Einkauf */
.l-rez{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.l-rez li{display:flex;align-items:center;gap:10px}
.l-rez .en{flex:1}
.l-rez .stepper button{width:36px;height:36px}
.stand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.gang{display:grid;gap:4px}
.gang h3{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.gang h3 small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.gang.vorrat h3{border-bottom-color:var(--line)}
.posten{list-style:none;margin:0;padding:0}
.posten li{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.posten label{flex:1;min-width:0;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:10px;min-height:52px;cursor:pointer}
.posten input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.posten .name{min-width:0}
.posten .refs{display:block;font-size:12px;color:var(--muted)}
.refs button{border:0;background:none;padding:0 2px;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:12px}
.posten .menge{text-align:right;font-family:var(--f-mono);font-size:14px;white-space:nowrap}
.posten .menge small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.posten input:checked~.name,.posten input:checked~.menge{color:var(--muted);text-decoration:line-through}

/* Formulare */
.formular{display:grid;gap:12px;margin:0}
.formular label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.formular input,.formular select,.formular textarea,#suche{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
.raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.formular input.auto{border-color:var(--accent);background:var(--accent-soft)}
.regler{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.regler .r-kopf{color:var(--ink);font-weight:700;font-size:15px}
.regler input[type=range]{width:100%;accent-color:var(--accent);height:32px;padding:0;border:0;background:transparent}
.regler .r-wert{color:var(--muted);font-size:14px;min-height:2.6em}
.naehr tr.summe th,.naehr tr.summe td{font-weight:700;border-bottom:2px solid var(--ink)}
.g-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.g-liste li{display:flex;justify-content:space-between;align-items:center;gap:12px}
.g-liste .zahl{font-size:13px;white-space:nowrap}
.garmin-karte{gap:8px}
.summe-karte{gap:8px}
.summe-karte .unter{margin:0}
.foto{display:contents}
.foto .fuss{margin:-6px 0 0}
.ocr-bild{display:block;width:100%;max-height:170px;object-fit:contain;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:2}
#pf-ocr{display:contents}
.raster>.knopf{grid-column:1/-1}
.kopie,.log{width:100%;min-height:220px;font-family:var(--f-mono);font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow:auto;margin:0}
.log{min-height:0;max-height:240px}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,12,.45);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start;transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .22s ease;overscroll-behavior:contain}
.sheet-wrap.voll .sheet{height:100%;max-height:100%;border-radius:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.sheet-wrap.offen .sheet-bg{opacity:1}
.sheet-wrap.offen .sheet{transform:none;opacity:1}
.sh-kopf{display:flex;align-items:center;gap:10px;min-height:40px}
.sh-kopf>span{flex:1}
.sh-fuss{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.sh-fuss .knopf.voll{flex:1 1 100%}
.menge-zeile{display:grid;gap:10px;justify-items:start}
.einheiten{display:flex;flex-wrap:wrap;gap:6px}
.vorschau{display:grid;grid-template-columns:1.3fr repeat(3,minmax(0,1fr));gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.vorschau>div{display:grid;min-width:0}
.vorschau b{font-weight:500;font-size:16px}
details.mehr summary{cursor:pointer;color:var(--accent);font-size:14px}
.lade{color:var(--muted)}
.gross-lade{font-size:18px;padding:30px 0;text-align:center}

/* Scanner */
.scanner{background:#000;color:#fff}
.scanner .leise{color:#cfd6d0}
.scanner .rund{background:#1b1f1c;border-color:#333;color:#fff}
.kamera{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;background:#111;border-radius:16px;overflow:hidden}
.kamera video{width:100%;height:100%;object-fit:cover;display:block}
.rahmen{position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.code-hand{display:flex;gap:8px}
.code-hand input{flex:1;min-width:0;border:1px solid #333;background:#111;color:#fff;border-radius:10px;padding:11px 12px;font-size:16px}

/* Navigation und Meldungen */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.nav button{border:0;background:none;height:var(--nav-h);display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:12px}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--accent);font-weight:700}
#scan-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:21;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
#scan-fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
#update{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:608px;margin:0 auto}
#update button{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;font-weight:700;cursor:pointer}
@media (min-width:560px){.zutaten{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="app-kopf"><span class="marke">Eiweiß-Küche</span></header>
<main id="main" aria-live="polite"></main>

<button id="scan-fab" aria-label="Barcode scannen"><svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>Scannen</button>
